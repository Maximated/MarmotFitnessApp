{% macro nav_arrow(url, direction, label, id=None, double=False, extra_class="") %}
  <a href="{{ url }}" class="btn-glass-arrow{% if direction == 'next' %} btn-glass-arrow--next{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}" aria-label="{{ label }}"{% if id %} id="{{ id }}"{% endif %}>
    {% if double %}
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="18 6 12 12 18 18"></polyline>
        <polyline points="11 6 5 12 11 18"></polyline>
      </svg>
    {% else %}
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 6 9 12 15 18"></polyline>
      </svg>
    {% endif %}
  </a>
{% endmacro %}
