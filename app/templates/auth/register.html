{% extends "base.html" %}

{% block content %}
  <div class="login-content">
    <h1>Crear cuenta</h1>

    {% if error %}<p class="login-error">{{ error }}</p>{% endif %}

    <form method="post" action="/register" class="login-form">
      <input type="text" name="name" placeholder="Nombre" value="{{ name or '' }}" required />
      <input type="email" name="email" placeholder="Email" value="{{ email or '' }}" required autocomplete="email" />
      <input type="password" name="password" placeholder="Contraseña (mínimo 8 caracteres)" required autocomplete="new-password" minlength="8" />
      <input type="password" name="password_confirm" placeholder="Repite la contraseña" required autocomplete="new-password" minlength="8" />
      <button type="submit" class="btn-modal btn-modal-primary">Crear cuenta</button>
    </form>

    <p><a href="/">Volver</a></p>
  </div>
{% endblock %}
