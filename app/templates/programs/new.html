{% extends "base.html" %}
{% from "_nav_arrows.html" import nav_arrow %}

{% block content %}
  <div class="page-nav-row">{{ nav_arrow("/programs", "back", "Volver a programas") }}</div>

  <h1>Nuevo programa</h1>

  <form method="post" action="/programs">
    <label>Nombre <input type="text" name="name" required /></label>
    <label>Días de ciclo <input type="number" name="cycle_days" min="1" required /></label>
    <button type="submit">Crear programa</button>
  </form>

  <h2>O importar desde JSON</h2>
  {% if error %}
    <p style="color: var(--danger);">{{ error }}</p>
  {% endif %}
  <form method="post" action="/programs/import" enctype="multipart/form-data" id="import-form">
    <label for="import-file-input" class="dropzone" id="import-dropzone">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>Suelta el archivo JSON aquí o haz clic para elegirlo</span>
      <span class="dropzone-filename" id="dropzone-filename"></span>
    </label>
    <input type="file" name="file" id="import-file-input" accept=".json,application/json" required class="hidden" />
    <button type="submit">Importar</button>
  </form>

  <script>
    (function () {
      const dropzone = document.getElementById("import-dropzone");
      const fileInput = document.getElementById("import-file-input");
      const filenameEl = document.getElementById("dropzone-filename");

      function showFilename() {
        filenameEl.textContent = fileInput.files.length ? fileInput.files[0].name : "";
      }

      fileInput.addEventListener("change", showFilename);

      ["dragenter", "dragover"].forEach((eventName) => {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropzone.classList.add("dragover");
        });
      });

      ["dragleave", "dragend"].forEach((eventName) => {
        dropzone.addEventListener(eventName, () => {
          dropzone.classList.remove("dragover");
        });
      });

      dropzone.addEventListener("drop", (event) => {
        event.preventDefault();
        dropzone.classList.remove("dragover");
        if (event.dataTransfer.files.length) {
          fileInput.files = event.dataTransfer.files;
          showFilename();
        }
      });
    })();
  </script>
{% endblock %}
