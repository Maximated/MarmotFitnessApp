{% extends "base.html" %}
{% from "_nav_arrows.html" import nav_arrow %}

{% block content %}
  <div class="page-nav-row">{{ nav_arrow(next, "back", "Volver") }}</div>

  <a href="/exercises/{{ exercise.id }}/view?next={{ next | urlencode }}" target="_blank" rel="noopener">
    <img src="{{ exercise.gif_url }}" alt="{{ exercise.name }}" width="180" height="180" />
  </a>
  <h1>Editar serie — {{ exercise.name }}</h1>

  <form method="post" action="/workout-sets/{{ workout_set.id }}/edit">
    <label>Peso (kg) <input type="number" step="0.5" name="weight" value="{{ workout_set.weight if workout_set.weight is not none else '' }}" /></label>
    {% if workout_set.duration_seconds is not none %}
      <label>Duración (segundos) <input type="number" name="duration_seconds" value="{{ workout_set.duration_seconds }}" required /></label>
    {% else %}
      <label>Repeticiones <input type="number" name="reps" value="{{ workout_set.reps }}" required /></label>
    {% endif %}
    <label>Fecha <input type="date" name="date" value="{{ date }}" required /></label>
    <label>Hora <input type="time" name="time" value="{{ workout_set.time.strftime('%H:%M') }}" required /></label>
    <label>Notas <textarea name="comment">{{ workout_set.comment or "" }}</textarea></label>
    <input type="hidden" name="next" value="{{ next }}" />
    <button type="submit">Guardar cambios</button>
  </form>

  <a href="{{ next }}">Cancelar</a>
{% endblock %}
