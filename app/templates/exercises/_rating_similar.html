<div class="star-rating">
  {% for i in range(1, 6) %}
    <form method="post" action="/exercises/{{ exercise.id }}/rate" class="star-form">
      <input type="hidden" name="rating" value="{{ i }}" />
      <input type="hidden" name="next" value="{{ self_url }}" />
      <button type="submit" class="star-btn{% if user_rating and i <= user_rating %} star-filled{% endif %}" aria-label="{{ i }} estrellas">★</button>
    </form>
  {% endfor %}
</div>

{% if similar_exercises %}
  <h2>Ejercicios similares</h2>
  <ul class="exercise-row-list">
    {% for similar in similar_exercises %}
      <li>
        <a href="/exercises/{{ similar.id }}/log" class="exercise-row">
          <img src="{{ similar.gif_url }}" alt="{{ similar.name }}" />
          <span>{{ similar.name }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
{% endif %}
