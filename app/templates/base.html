<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Marmot Fitness App{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ css_version }}" />
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="apple-touch-icon" href="/static/icons/icon-180.png" />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    {% block head_extra %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <a href="/" class="brand">
          <img src="/static/icons/icon-512.png" alt="Marmot" class="logo" />
          Marmot
        </a>
        <a href="/exercises">Ejercicios</a>
        <a href="/history">Historial</a>
        <a href="/programs">Programas</a>
      </nav>
    </header>
    {% block full_width %}{% endblock %}
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <script src="/static/js/app.js" defer></script>
  </body>
</html>
