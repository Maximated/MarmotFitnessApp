services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: marmot
      POSTGRES_PASSWORD: marmot
      POSTGRES_DB: marmot
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marmot -d marmot"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/maximated/marmotfitness:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/code/media
    ports:
      - "8000:8000"

volumes:
  db_data:
